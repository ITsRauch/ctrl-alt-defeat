# Run ./setup.sh once first (creates data/, secrets/admin_password and .env), then:
#   docker compose up -d --build
name: ctrl-alt-defeat
services:
  game:
    build: .
    image: ctrl-alt-defeat:1.4
    restart: unless-stopped
    init: true
    read_only: true
    user: "${APP_UID:-1000}:${APP_GID:-1000}"     # owner of ./data (written to .env by setup.sh)
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 256m
    pids_limit: 128
    ports:
      # LAN only - never forward this port to the internet. Set BIND_IP in .env to your server's
      # LAN address to listen on that interface only (default: all interfaces).
      - "${BIND_IP:-0.0.0.0}:${PORT:-8091}:8091"
    environment:
      ADMIN_PASSWORD_FILE: /run/secrets/admin_password
    volumes:
      - ./data:/app/data                                    # highscores.json + tickets.json
      - ./secrets/admin_password:/run/secrets/admin_password:ro
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
